<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tiny Kingdom: a small floating village that keeps earning">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb84d"/><stop offset="1" stop-color="#ff5c7a"/></linearGradient></defs>
<rect width="800" height="450" fill="url(#bg)"/>
<g fill="#fff" opacity=".5"><ellipse cx="120" cy="90" rx="60" ry="16"/><ellipse cx="150" cy="78" rx="34" ry="13"/><ellipse cx="690" cy="130" rx="58" ry="15"/><ellipse cx="660" cy="118" rx="32" ry="12"/></g>
<g stroke="#17111a" stroke-width="5" stroke-linejoin="round">
<path d="M150 300C150 290 250 262 400 262S650 290 650 300C650 360 560 380 520 410L480 440H320L280 410C240 380 150 360 150 300z" fill="#8a5a45"/>
<path d="M150 296C150 270 250 244 400 244S650 270 650 296C650 322 540 340 400 340S150 322 150 296z" fill="#3fe0b5"/>
<path d="M170 296C190 312 290 326 400 326" fill="none" stroke="#2fb08a" stroke-width="5"/></g>
<!-- castle -->
<g stroke="#17111a" stroke-width="5" stroke-linejoin="round"><path d="M340 288V190h30v-18h16v18h28v-18h16v18h30v98z" fill="#ffe3b3" transform="translate(-10 0)"/><path d="M386 288v-40a16 16 0 0132 0v40z" fill="#5a2f2f" transform="translate(-10 0)"/><path d="M345 190v-30h22v30M415 190v-30h22v30" fill="#ffd27a" transform="translate(-10 0)"/></g>
<path d="M356 160v-34" stroke="#17111a" stroke-width="5"/><path d="M356 126l30 9-30 9z" fill="#ff5c7a" stroke="#17111a" stroke-width="4" stroke-linejoin="round"/>
