<g transform="translate(600 190)"><circle r="18" fill="#ffd84d"/><circle r="10" fill="none" stroke-width="3"/><animateTransform attributeName="transform" type="translate" values="600 190;600 180;600 190" dur="2.9s" repeatCount="indefinite"/></g>
