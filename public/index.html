		<script>
			// Single-page-app deep links on GitHub Pages: restore the path that
			// 404.html packed into the query string.
			(function (l) {
				if (l.search[1] === "/") {
					var decoded = l.search
						.slice(1)
						.split("&")
						.map(function (s) {
							return s.replace(/~and~/g, "&");
						})
						.join("?");
					window.history.replaceState(
						null,
						null,
						l.pathname.slice(0, -1) + decoded + l.hash
					);
				}
			})(window.location);
			// Pre-rendered pages live at /about/ and so on; the app expects /about.
			(function (l) {
				if (l.pathname.length > 1 && l.pathname.slice(-1) === "/") {
					window.history.replaceState(null, null, l.pathname.slice(0, -1) + l.search + l.hash);
				}
			})(window.location);
		</script>
