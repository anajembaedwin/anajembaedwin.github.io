<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 45 900 915" role="img" aria-labelledby="t">
<title id="t">Cartoon portrait of Edwin Anajemba: short hair, full beard, black-framed glasses and a patterned shirt.</title>
<defs>
