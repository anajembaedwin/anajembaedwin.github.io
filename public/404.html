<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Edwin Anajemba</title>
		<script>
			// GitHub Pages serves this file for unknown paths. Send the visitor to
			// the app with the original path in the query string; index.html
			// restores it so client-side routes like /products/<name> work.
			var l = window.location;
			l.replace(
				l.protocol +
					"//" +
					l.hostname +
					(l.port ? ":" + l.port : "") +
					"/?/" +
					l.pathname.slice(1).replace(/&/g, "~and~") +
					(l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
					l.hash
			);
		</script>
	</head>
	<body></body>
</html>
