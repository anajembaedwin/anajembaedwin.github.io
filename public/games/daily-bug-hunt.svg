<text x="116" y="140" fill="#5b5390">1</text><text x="156" y="140">function total(items) {</text>
<text x="116" y="176" fill="#5b5390">2</text><text x="156" y="176">  let sum = 0;</text>
<text x="116" y="212" fill="#5b5390">3</text><text x="156" y="212">  for (let i = 0; i &lt;= items.length; i++) {</text>
<text x="116" y="248" fill="#5b5390">4</text><text x="156" y="248">    sum += items[i].price;</text>
<text x="116" y="284" fill="#5b5390">5</text><text x="156" y="284">  }</text>
<text x="116" y="320" fill="#5b5390">6</text><text x="156" y="320">  return sum;</text>
<text x="116" y="356" fill="#5b5390">7</text><text x="156" y="356">}</text></g>
<rect x="100" y="188" width="600" height="34" rx="8" fill="#ff5c7a" opacity=".28"/>
