<g stroke="#17111a" stroke-width="5"><rect x="60" y="0" width="680" height="54" rx="14" fill="#ffffff" opacity=".92"/><rect x="60" y="66" width="680" height="54" rx="14" fill="#ffffff" opacity=".92"/><rect x="60" y="132" width="680" height="54" rx="14" fill="#ffffff" opacity=".92"/><rect x="60" y="198" width="680" height="54" rx="14" fill="#ffffff" opacity=".92"/></g>
