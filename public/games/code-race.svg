<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Code Race: racers on a typing track">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d8cff"/><stop offset="1" stop-color="#6b4cff"/></linearGradient>
<symbol id="car" viewBox="0 0 60 34"><g stroke="#17111a" stroke-width="3" stroke-linejoin="round"><rect x="6" y="14" width="48" height="14" rx="6" fill="currentColor"/><path d="M16 14l7-10h16l7 10z" fill="currentColor"/><path d="M20 13l5-7h10l5 7z" fill="#141b34"/><circle cx="17" cy="29" r="5" fill="#14101c"/><circle cx="43" cy="29" r="5" fill="#14101c"/></g></symbol></defs>
